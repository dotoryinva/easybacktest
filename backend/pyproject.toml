[project]
name = "easybacktest-backend"
version = "0.1.0"
description = "AI-native stock backtesting backend (KR + US markets)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-generativeai>=0.3.0",
    # pandas is pinned <3 and numpy <2.1: finance-datareader / pykrx / yfinance do not
    # yet support pandas 3.x, and an unpinned resolve pulls it in and breaks ingestion.
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "finance-datareader>=0.9.94",
    "pykrx>=1.0.45",
    "yfinance>=0.2.50",
    "apscheduler>=3.10",
    "python-ulid>=3.0",
    "httpx>=0.27",
    # setuptools <81 still ships pkg_resources, which pykrx imports at load time.
    "setuptools>=68,<81",
    "quantstats>=0.0.81",
    "playwright>=1.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
