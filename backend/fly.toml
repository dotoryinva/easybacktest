app = "easybacktest-api"
primary_region = "nrt"                 # Tokyo — closest to the KRX data sources

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  DATABASE_URL = "sqlite:////data/strategies.db"
  ENABLE_SCHEDULER = "true"
  GEMINI_MODEL = "gemini-3.6-flash"
  GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
  GEMINI_USE_FALLBACK_MODEL = "false"
  # Set the real origin once Cloudflare Pages is deployed:
  #   fly secrets set CORS_ORIGINS="https://easybacktest.pages.dev"
  CORS_ORIGINS = "http://localhost:5173"

# The Parquet OHLCV cache and the SQLite database both live on this volume.
#   fly volumes create easybacktest_data --size 3 --region nrt
[[mounts]]
  source = "easybacktest_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The nightly APScheduler job runs in-process, so the machine must stay up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    Cache-Control = "no-store"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
